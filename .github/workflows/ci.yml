name: CI

on:
  push:
    branches: [ dev, main, codex/all-local-changes-20260331-110158 ]
  pull_request:
    branches: [ dev, main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests + Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shop" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: test-secret
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      DEBUG: 1
      TELEGRAM_BOT_TOKEN: test-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Production candidate must contain current dev
        if: github.ref == 'refs/heads/codex/all-local-changes-20260331-110158'
        run: |
          git fetch origin dev
          if ! git merge-base --is-ancestor origin/dev HEAD; then
            echo "Production candidate is behind dev. Merge dev before deployment." >&2
            git log --oneline HEAD..origin/dev | head -50 >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend deps (dev)
        working-directory: backend
        run: uv sync --no-cache

      - name: Install legacy storefront deps
        run: npm ci

      - name: Install Next storefront deps
        working-directory: frontend
        run: npm ci

      - name: Build legacy storefront assets
        run: |
          npm run tw:build
          test -s backend/static/css/app.css

      - name: Typecheck and build Next storefront foundation
        working-directory: frontend
        run: |
          npm run typecheck
          npm run build

      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium

      - name: Run tests with coverage
        working-directory: backend
        run: ./.venv/bin/python -m pytest

      - name: Production settings preflight
        working-directory: backend
        env:
          DEBUG: 0
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci_prod_secret_key_2026_x7V4mK9pQ2nR8sT5uW1yZ6AaBbCcDdEe
          INTERNAL_TOKEN: ci-internal-token
          ORDER_APPROVE_SECRET: ci-order-approve-secret
          METRICS_TOKEN: ci-metrics-token
          TELEGRAM_BOT_TOKEN: ci-telegram-token
          ALLOWED_HOSTS: servio.test,www.servio.test
          CSRF_TRUSTED_ORIGINS: https://servio.test,https://www.servio.test
        run: ./.venv/bin/python manage.py check --deploy --fail-level WARNING

      - name: Check deploy-compose drift
        run: python scripts/check_deploy_compose_drift.py

      - name: Enforce 100% coverage for views
        working-directory: backend
        run: python ../scripts/check_views_coverage.py coverage.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: backend/coverage.xml

      - name: Ruff (lint)
        run: backend/.venv/bin/python -m ruff check .

      - name: Validate Swarm deployment assets
        run: |
          set -euo pipefail
          for script in \
            scripts/swarm_bootstrap_manager.sh \
            scripts/swarm_bootstrap_worker.sh \
            scripts/swarm_deploy.sh \
            scripts/swarm_healthcheck.sh \
            scripts/swarm_rollback.sh \
            scripts/swarm_backup_postgres.sh \
            scripts/install_swarm_backup_cron.sh \
            scripts/check_migration_safety.sh; do
            bash -n "$script"
          done
          printf 'DJANGO_SECRET_KEY=ci\nPOSTGRES_DB=shop\nPOSTGRES_USER=shop\nPOSTGRES_PASSWORD=shop\nINTERNAL_TOKEN=ci\nORDER_APPROVE_SECRET=ci\nMETRICS_TOKEN=ci\nTELEGRAM_BOT_TOKEN=ci\nALLOWED_HOSTS=24sparts.ru\nCSRF_TRUSTED_ORIGINS=https://24sparts.ru\nGRAFANA_ADMIN_PASSWORD=ci\n' > "$RUNNER_TEMP/prod.env"
          printf 'TELEGRAM_BOT_TOKEN=ci\nINTERNAL_TOKEN=ci\n' > "$RUNNER_TEMP/bot.env"
          cp "$RUNNER_TEMP/bot.env" "$RUNNER_TEMP/bot-notify.env"
          IMAGE_TAG=ci \
          PROD_ENV_FILE="$RUNNER_TEMP/prod.env" \
          PROD_BOT_ENV_FILE="$RUNNER_TEMP/bot.env" \
          PROD_BOT_NOTIFY_ENV_FILE="$RUNNER_TEMP/bot-notify.env" \
          GRAFANA_ADMIN_PASSWORD=ci \
          docker stack config -c deploy/swarm/stack.yml >/dev/null

      - name: Check migration safety against dev
        if: github.ref == 'refs/heads/codex/all-local-changes-20260331-110158'
        run: BASE_REF=origin/dev scripts/check_migration_safety.sh

      - name: Browser smoke
        env:
          OPENSEARCH_ENABLED: 0
          SENTRY_DSN: ""
          PUBLIC_SENTRY_DSN: ""
          SENTRY_BROWSER_SDK_URL: ""
          SMOKE_BASE_URL: http://127.0.0.1:8000
          SMOKE_ARTIFACT_DIR: output/playwright
        run: |
          mkdir -p output/playwright
          cd backend
          ./.venv/bin/python manage.py migrate --noinput
          ./.venv/bin/python manage.py seed_smoke_data
          nohup ./.venv/bin/python manage.py runserver 127.0.0.1:8000 > ../output/playwright/django-server.log 2>&1 &
          cd ..
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health/ >/dev/null
          npm run smoke:browser

      - name: Visual regression check
        env:
          OPENSEARCH_ENABLED: 0
          SENTRY_DSN: ""
          PUBLIC_SENTRY_DSN: ""
          SENTRY_BROWSER_SDK_URL: ""
          SMOKE_BASE_URL: http://127.0.0.1:8000
          VISUAL_BASELINE_DIR: tests/visual-baselines/storefront
          VISUAL_CURRENT_DIR: output/playwright/current
          VISUAL_DIFF_DIR: output/playwright/diff
        run: npm run visual:check

      - name: Upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: output/playwright
