name: Deploy Production Swarm

on:
  push:
    branches:
      - codex/all-local-changes-20260331-110158
  workflow_dispatch:

concurrency:
  group: production-swarm
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build images and deploy 24sparts.ru
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment scripts
        run: |
          set -eux
          bash -n scripts/swarm_bootstrap_manager.sh
          bash -n scripts/swarm_bootstrap_worker.sh
          bash -n scripts/swarm_deploy.sh
          bash -n scripts/swarm_healthcheck.sh
          bash -n scripts/swarm_rollback.sh

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/two-potato/servio-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/two-potato/servio-frontend:${{ github.sha }}

      - name: Build and push bot
        uses: docker/build-push-action@v6
        with:
          context: ./bot
          push: true
          tags: ghcr.io/two-potato/servio-bot:${{ github.sha }}

      - name: Build and push search-api
        uses: docker/build-push-action@v6
        with:
          context: ./services/search-api
          push: true
          tags: ghcr.io/two-potato/servio-search-api:${{ github.sha }}

      - name: Build and push recommendation-api
        uses: docker/build-push-action@v6
        with:
          context: ./services/recommendation-api
          push: true
          tags: ghcr.io/two-potato/servio-recommendation-api:${{ github.sha }}

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST"
          : "${SSH_PORT:=22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy stack on manager
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          APP_DIR: ${{ secrets.PROD_APP_DIR }}
          DEPLOY_REF: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          set -eu
          : "${SSH_PORT:=22}"
          : "${SSH_USER:=sergey}"
          : "${APP_DIR:=/opt/servio/current}"
          printf '%s' "$GHCR_TOKEN" | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=accept-new \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' DEPLOY_REF='$DEPLOY_REF' IMAGE_TAG='$DEPLOY_REF' LETSENCRYPT_EMAIL='$LETSENCRYPT_EMAIL' bash -s" <<'EOSSH'
          set -euo pipefail
          cd "$APP_DIR"
          git fetch --all --prune
          git checkout -f codex/all-local-changes-20260331-110158
          git reset --hard "$DEPLOY_REF"
          git clean -fd
          chmod +x scripts/swarm_*.sh
          IMAGE_TAG="$IMAGE_TAG" LETSENCRYPT_EMAIL="$LETSENCRYPT_EMAIL" ./scripts/swarm_deploy.sh
          EOSSH
