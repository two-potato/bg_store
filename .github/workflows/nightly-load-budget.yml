name: Nightly Load Budget

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  staircase-nightly:
    runs-on: ubuntu-latest
    if: ${{ secrets.LOAD_TEST_HOST != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locust runtime
        run: |
          python -m venv .locust_env
          .locust_env/bin/pip install --upgrade pip
          .locust_env/bin/pip install locust

      - name: Run nightly staircase profile
        env:
          HOST: ${{ secrets.LOAD_TEST_HOST }}
          STAIRCASE_PROFILE: nightly
        run: |
          chmod +x scripts/run_prod_staircase_load.sh
          scripts/run_prod_staircase_load.sh | tee /tmp/load_run_output.txt
          echo "RUN_DIR=$(tail -n 1 /tmp/load_run_output.txt)" >> $GITHUB_ENV

      - name: Summarize run
        run: |
          python3 scripts/summarize_locust_runs.py "$RUN_DIR"

      - name: Enforce load budgets
        run: |
          python3 scripts/check_locust_budget.py \
            --run-dir "$RUN_DIR" \
            --max-p95-ms 1200 \
            --max-failure-rate 0.01

      - name: Upload load artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-load-artifacts
          path: ${{ env.RUN_DIR }}
