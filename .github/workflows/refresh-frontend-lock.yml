name: Refresh Frontend Lockfile

on:
  push:
    branches:
      - codex/all-local-changes-20260331-110158
    paths:
      - frontend/package.json
  pull_request:
    branches:
      - dev
    paths:
      - frontend/package.json
      - .github/workflows/refresh-frontend-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production candidate branch
        uses: actions/checkout@v4
        with:
          ref: codex/all-local-changes-20260331-110158

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh lockfile
        working-directory: frontend
        run: npm install --package-lock-only

      - name: Commit refreshed lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git commit -m 'chore: refresh frontend security lockfile'
          git push origin HEAD:codex/all-local-changes-20260331-110158
