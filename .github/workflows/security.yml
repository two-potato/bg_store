name: Security Audit

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - backend
          - bot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync project environment
        working-directory: ${{ matrix.project }}
        run: uv sync --no-cache

      - name: Install pip-audit
        working-directory: ${{ matrix.project }}
        run: ./.venv/bin/python -m pip install pip-audit

      - name: Run pip-audit
        working-directory: ${{ matrix.project }}
        run: ./.venv/bin/pip-audit

  npm-audit:
    name: NPM Production Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run production dependency audit
        run: npm audit --omit=dev
