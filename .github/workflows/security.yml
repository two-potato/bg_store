name: Security Audit

on:
  push:
    branches: [dev, main, codex/all-local-changes-20260331-110158]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  python-audit:
    name: Python Dependency Audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - backend
          - bot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Export locked production dependencies
        working-directory: ${{ matrix.project }}
        run: uv export --frozen --no-dev --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/${{ matrix.project }}-requirements.txt"

      - name: Run pip-audit
        run: uvx --from pip-audit pip-audit -r "$RUNNER_TEMP/${{ matrix.project }}-requirements.txt"

  npm-audit:
    name: NPM Production Audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - .
          - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Run production dependency audit
        working-directory: ${{ matrix.project }}
        run: npm audit --omit=dev
