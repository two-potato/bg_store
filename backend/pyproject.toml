[project]
name = "bad-guys-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "django-jazzmin>=3.0.1,<4",
  "Django>=5.2,<5.3",
  "djangorestframework>=3.15,<3.17",
  "drf-nested-routers>=0.93,<0.95",
  "psycopg[binary]>=3.2,<3.3",
  "django-cors-headers>=4.4,<5",
  "djangorestframework-simplejwt>=5.3,<5.6",
  "redis>=5.0,<6",
  "celery>=5.4,<5.6",
  "httpx>=0.27,<0.29",
  "weasyprint>=61.0,<63",
  "uvicorn>=0.30,<0.39",
  "gunicorn>=22.0,<24",
  "python-dotenv>=1.0,<2",
  "django-fsm>=2.8,<2.9",
  "drf-spectacular>=0.27,<0.29",
  "django-filter>=24.2,<26",
  "prometheus-client>=0.20,<1",
  "django-allauth>=64.0,<66",
  "sentry-sdk[django]>=2.18,<3",
  "requests>=2.32,<3",
  "cryptography>=42.0,<46",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5,<1.8"]

[tool.uv]
dev-dependencies = ["pytest", "pytest-django", "pytest-cov", "ruff", "mypy"]
