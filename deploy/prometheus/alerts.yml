groups:
  - name: infrastructure
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "Job {{ $labels.job }} on {{ $labels.instance }} has been down for >1m"

      - alert: NginxHighActiveConnections
        expr: nginx_connections_active > 500
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High active connections on Nginx"
          description: "Active connections = {{ $value }}"

      - alert: HighCPUBackend
        expr: rate(process_cpu_seconds_total{job="backend"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on backend"
          description: ">80% CPU for 5m"

      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Loki is down"
          description: "No metrics from Loki for 1m"

      - alert: CriticalServiceDown
        expr: up{job=~"backend|bot|postgres|redis|nginx"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical service is down"
          description: "Service {{ $labels.job }} on {{ $labels.instance }} is down"

      - alert: HostHighCPU
        expr: (100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High host CPU usage"
          description: "CPU usage on {{ $labels.instance }} is {{ printf \"%.1f\" $value }}% for 5m"

      - alert: HostHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High host memory usage"
          description: "Memory usage on {{ $labels.instance }} is {{ printf \"%.1f\" $value }}% for 5m"

      - alert: HostDiskLow
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) * 100 < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on root filesystem"
          description: "Only {{ printf \"%.1f\" $value }}% disk space left on {{ $labels.instance }}"

      - alert: ContainerHighCPU
        expr: (sum by (name) (rate(container_cpu_usage_seconds_total{name=~".*(servio-|servio-backend).*", image!=""}[5m])) / scalar(count(node_cpu_seconds_total{mode="idle"}))) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High container CPU usage"
          description: "Container {{ $labels.name }} CPU usage is {{ printf \"%.1f\" $value }}% for 5m"

      - alert: BlackboxProbeFailed
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Blackbox HTTP probe failed"
          description: "Probe to {{ $labels.instance }} is failing"

      - alert: GlitchTipDown
        expr: probe_success{job="blackbox", instance="http://host.docker.internal:18000/"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "GlitchTip is down"
          description: "GlitchTip probe at {{ $labels.instance }} is failing for more than 2 minutes"

      - alert: SearchZeroResultsHigh
        expr: max(servio:search:zero_result_share5m) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Search zero-result share is high"
          description: "Zero-result share is above 25% for {{ $labels.surface }}/{{ $labels.provider }} during the last 10 minutes"

      - alert: SearchLatencyP95High
        expr: max(servio:search:latency_p95_seconds5m) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Search latency p95 is high"
          description: "Search p95 latency is above 0.8s for {{ $labels.surface }}/{{ $labels.provider }} during the last 10 minutes"

      - alert: SearchClicksMissing
        expr: sum(rate(servio_search_requests_total{outcome="ok"}[15m])) > 0.02 and sum(rate(servio_search_feedback_events_total{event_name="search_result_click"}[15m])) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Search traffic has no click feedback"
          description: "Search returns results, but no search_result_click events were observed for 15 minutes"

      - alert: SearchAttributedOrdersMissing
        expr: sum(increase(servio_search_feedback_events_total{event_name="search_result_click"}[6h])) > 20 and sum(increase(servio_search_attributed_orders_total[6h])) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Search clicks are not converting into attributed orders"
          description: "There were more than 20 search_result_click events in the last 6 hours, but zero attributed orders were recorded"
