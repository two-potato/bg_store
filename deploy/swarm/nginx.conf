events {}

http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  gzip_min_length 256;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream servio_frontend {
    server frontend:3000;
    keepalive 32;
  }

  upstream servio_backend {
    server backend:8000;
    keepalive 32;
  }

  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 24sparts.ru www.24sparts.ru;
    client_max_body_size 32m;

    location = /nginx-health {
      default_type application/json;
      return 200 '{"ok":true,"component":"nginx"}';
    }

    location = /health/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header Connection "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
      proxy_pass http://servio_backend/ready/;
    }

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 24sparts.ru www.24sparts.ru;
    client_max_body_size 32m;

    ssl_certificate /etc/letsencrypt/live/24sparts.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/24sparts.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /nginx-health {
      default_type application/json;
      return 200 '{"ok":true,"component":"nginx"}';
    }

    location = /health/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
      proxy_pass http://servio_backend/ready/;
    }

    location = /ready/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
      proxy_pass http://servio_backend/ready/;
    }

    location = /metrics {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_pass http://servio_backend/metrics;
    }

    location /static/ {
      alias /staticfiles/;
      access_log off;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /media/ {
      alias /media/;
      access_log off;
      expires 7d;
      add_header Cache-Control "public, max-age=604800" always;
    }

    location ^~ /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 180s;
      proxy_pass http://servio_backend;
    }

    location ^~ /admin/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 180s;
      proxy_pass http://servio_backend;
    }

    # Next.js is the only customer-facing storefront. Account, cart, catalog,
    # checkout and all other presentation routes stay on the frontend service.
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 5s;
      proxy_read_timeout 180s;
      proxy_pass http://servio_frontend;
    }
  }
}
