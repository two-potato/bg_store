services:
  frontend:
    environment:
      NODE_ENV: development
      SITE_URL: "http://localhost:8080"
    command:
      [
        "sh",
        "-lc",
        "npm ci && exec npm run dev -- --hostname 0.0.0.0 --port 3000",
      ]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: 1
    environment:
      DEBUG: "1"
      OPENSEARCH_ENABLED: "1"
      SENTRY_DSN: ""
      PUBLIC_SENTRY_DSN: ""
      SENTRY_BROWSER_SDK_URL: ""
    command:
      [
        "sh",
        "-lc",
        "until /app/.venv/bin/python manage.py migrate --noinput; do echo 'Waiting for DB...'; sleep 2; done; /app/.venv/bin/python manage.py collectstatic --noinput --ignore admin/js/cancel.js --ignore admin/js/popup_response.js; exec /app/.venv/bin/python -m uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload",
      ]
  celery-worker:
    environment:
      DEBUG: "1"
      OPENSEARCH_ENABLED: "1"
      SENTRY_DSN: ""
  celery-beat:
    environment:
      DEBUG: "1"
      OPENSEARCH_ENABLED: "1"
      SENTRY_DSN: ""
  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile.dev
    environment:
      STOREFRONT_NEXT_PUBLIC_ENABLED: "1"

  search-api:
    ports:
      - "18110:8010"

  recommendation-api:
    ports:
      - "18111:8011"
