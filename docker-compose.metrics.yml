name: servio
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  bot-notify:
    environment:
      ALERTMANAGER_SKIP_IF_NO_CHAT: "1"

  glitchtip-postgres:
    image: public.ecr.aws/docker/library/postgres:16
    container_name: servio-glitchtip-postgres
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
    volumes:
      - glitchtip_pgdata:/var/lib/postgresql/data
    logging: *default-logging
    restart: unless-stopped

  glitchtip-redis:
    image: valkey/valkey:8
    container_name: servio-glitchtip-redis
    logging: *default-logging
    restart: unless-stopped

  glitchtip:
    image: glitchtip/glitchtip:6
    container_name: servio-glitchtip
    env_file:
      - path: ./deploy/glitchtip/.env.example
        required: true
      - path: ./deploy/glitchtip/.env
        required: false
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      VALKEY_URL: redis://glitchtip-redis:6379
      PORT: 8000
      SERVER_ROLE: all_in_one
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
    ports:
      - "${GLITCHTIP_PORT:-18000}:8000"
    volumes:
      - glitchtip_uploads:/code/uploads
    logging: *default-logging
    restart: unless-stopped

  prometheus:
    image: mirror.gcr.io/prom/prometheus
    container_name: servio-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/prometheus/search_rules.yml:/etc/prometheus/search_rules.yml:ro
    logging: *default-logging
    restart: unless-stopped

  loki:
    image: mirror.gcr.io/grafana/loki:2.9.0
    container_name: servio-loki
    user: "0:0"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./deploy/loki/config.yml:/etc/loki/config.yml:ro
      - ./deploy/loki/rules/fake/rules.yml:/etc/loki/rules/fake/rules.yml:ro
      - loki-wal:/wal
      - loki-data:/loki
    logging: *default-logging
    restart: unless-stopped

  nginx-exporter:
    image: mirror.gcr.io/nginx/nginx-prometheus-exporter:0.11.0
    container_name: servio-nginx-exporter
    command: ["-nginx.scrape-uri", "http://servio-nginx/nginx_status"]
    depends_on:
      nginx:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  alertmanager:
    image: mirror.gcr.io/prom/alertmanager
    container_name: servio-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.0
    container_name: servio-grafana
    ports:
      - "3000:3000"
    environment:
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: browser
      GF_EXPLORE_ENABLED: "true"
      GF_FEATURE_TOGGLES_ENABLE: logsExploreTableVisualisation
    volumes:
      - grafana:/var/lib/grafana
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    logging: *default-logging
    restart: unless-stopped

  promtail:
    image: mirror.gcr.io/grafana/promtail:2.9.0
    container_name: servio-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/promtail/config.yml:/etc/promtail/config.yml:ro
    command: ["--config.file=/etc/promtail/config.yml"]
    logging: *default-logging
    restart: unless-stopped

  postgres-exporter:
    image: mirror.gcr.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: servio-postgres-exporter
    command: ["--config.file=/etc/postgres-exporter/postgres_exporter.yml"]
    volumes:
      - ./deploy/postgres-exporter/postgres_exporter.yml:/etc/postgres-exporter/postgres_exporter.yml:ro
    environment:
      DATA_SOURCE_NAME: postgresql://shop:shop@db:5432/shop?sslmode=disable
    logging: *default-logging
    restart: unless-stopped

  redis-exporter:
    image: mirror.gcr.io/oliver006/redis_exporter:v1.61.0
    container_name: servio-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    logging: *default-logging
    restart: unless-stopped

  opensearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0
    container_name: servio-opensearch-exporter
    command: ["--es.uri=http://opensearch:9200", "--es.all"]
    logging: *default-logging
    restart: unless-stopped

  node-exporter:
    image: mirror.gcr.io/prom/node-exporter:v1.7.0
    container_name: servio-node-exporter
    command:
      - --path.rootfs=/rootfs
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
      - --collector.textfile.directory=/host/textfile
    volumes:
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /run/udev:/run/udev:ro
      - ./.artifacts/node_exporter_textfile:/host/textfile
    logging: *default-logging
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: servio-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    logging: *default-logging
    restart: unless-stopped

  blackbox:
    image: mirror.gcr.io/prom/blackbox-exporter:v0.24.0
    container_name: servio-blackbox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    logging: *default-logging
    restart: unless-stopped

volumes:
  grafana:
  loki-wal:
  loki-data:
  glitchtip_pgdata:
  glitchtip_uploads:
