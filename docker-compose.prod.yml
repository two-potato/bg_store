services:
  frontend:
    environment:
      NODE_ENV: production
      SITE_URL: "${SITE_URL:-https://24sparts.ru}"

  backend:
    env_file:
      - path: ./backend/.env.example
        required: true
      - path: ./backend/.env.prod.example
        required: true
      - path: ./backend/.env
        required: false
      - path: ./backend/.env.prod
        required: false
    environment:
      DEBUG: "0"
      DJANGO_SETTINGS_MODULE: config.settings.prod
      ENABLE_API_DOCS: "0"
      CACHE_BACKEND: redis
      ENABLE_REQUEST_ACCESS_LOG: "0"
      LOG_CALLS_ENABLED: "0"
      REQUEST_LOG_LEVEL: WARNING
      ENABLE_CATALOG_RATING: "0"
      SEARCH_SERVICE_MODE: "${SEARCH_SERVICE_MODE:-django-inline}"
      SEARCH_SERVICE_URL: "${SEARCH_SERVICE_URL:-http://search-api:8010}"
      SEARCH_SERVICE_TIMEOUT_SECONDS: "${SEARCH_SERVICE_TIMEOUT_SECONDS:-0.8}"
      SEARCH_SERVICE_SHADOW_ENABLED: "${SEARCH_SERVICE_SHADOW_ENABLED:-0}"
      SEARCH_SERVICE_SHADOW_SURFACES: "${SEARCH_SERVICE_SHADOW_SURFACES:-search-page,live-search}"
      SEARCH_SERVICE_CANARY_ENABLED: "${SEARCH_SERVICE_CANARY_ENABLED:-0}"
      SEARCH_SERVICE_CANARY_SURFACES: "${SEARCH_SERVICE_CANARY_SURFACES:-search-page}"
      SEARCH_SERVICE_CANARY_PERCENT: "${SEARCH_SERVICE_CANARY_PERCENT:-0}"
      SEARCH_SERVICE_ROLLOUT_LABEL: "${SEARCH_SERVICE_ROLLOUT_LABEL:-search-service}"
      SEARCH_SERVICE_OBSERVABILITY_LABEL: "${SEARCH_SERVICE_OBSERVABILITY_LABEL:-search-service}"
      RECOMMENDATION_SERVICE_MODE: "${RECOMMENDATION_SERVICE_MODE:-django-inline}"
      RECOMMENDATION_SERVICE_URL: "${RECOMMENDATION_SERVICE_URL:-http://recommendation-api:8011}"
      RECOMMENDATION_SERVICE_TIMEOUT_SECONDS: "${RECOMMENDATION_SERVICE_TIMEOUT_SECONDS:-0.8}"
      RECOMMENDATION_SERVICE_SHADOW_ENABLED: "${RECOMMENDATION_SERVICE_SHADOW_ENABLED:-0}"
      RECOMMENDATION_SERVICE_SHADOW_SURFACES: "${RECOMMENDATION_SERVICE_SHADOW_SURFACES:-home,pdp,cart,checkout,reorder}"
      RECOMMENDATION_SERVICE_CANARY_ENABLED: "${RECOMMENDATION_SERVICE_CANARY_ENABLED:-0}"
      RECOMMENDATION_SERVICE_CANARY_SURFACES: "${RECOMMENDATION_SERVICE_CANARY_SURFACES:-home,pdp}"
      RECOMMENDATION_SERVICE_CANARY_PERCENT: "${RECOMMENDATION_SERVICE_CANARY_PERCENT:-0}"
      RECOMMENDATION_SERVICE_ROLLOUT_LABEL: "${RECOMMENDATION_SERVICE_ROLLOUT_LABEL:-recommendation-service}"
      RECOMMENDATION_SERVICE_OBSERVABILITY_LABEL: "${RECOMMENDATION_SERVICE_OBSERVABILITY_LABEL:-recommendation-service}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-4}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-180}"
    depends_on:
      - db
      - redis
      - bot
    ports: []
    command:
      - python
      - -m
      - gunicorn
      - -k
      - uvicorn.workers.UvicornWorker
      - -c
      - python:config.gunicorn
      - config.asgi:application

  celery-worker:
    env_file:
      - path: ./backend/.env.example
        required: true
      - path: ./backend/.env.prod.example
        required: true
      - path: ./backend/.env
        required: false
      - path: ./backend/.env.prod
        required: false

  celery-beat:
    env_file:
      - path: ./backend/.env.example
        required: true
      - path: ./backend/.env.prod.example
        required: true
      - path: ./backend/.env
        required: false
      - path: ./backend/.env.prod
        required: false

  db:
    env_file:
      - path: ./backend/.env.example
        required: true
      - path: ./backend/.env.prod.example
        required: true
      - path: ./backend/.env
        required: false
      - path: ./backend/.env.prod
        required: false

  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    ports:
      - "443:443"
    volumes:
      - ./deploy/letsencrypt:/etc/letsencrypt:ro
      - ./deploy/certbot-www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy

  search-api:
    profiles: ["platform-services", "platform-shadow", "platform-canary"]

  recommendation-api:
    profiles: ["platform-services", "platform-shadow", "platform-canary"]

  mailpit:
    profiles: ["dev-only"]
    ports: []

volumes:
  pgdata:
    external: true
    name: servio_pgdata
