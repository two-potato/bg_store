name: servio
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  frontend:
    image: servio-frontend:dev
    container_name: servio-frontend
    build: ./frontend
    environment:
      PORT: "3000"
      SITE_URL: "${SITE_URL:-https://potatofarm.ru}"
      BACKEND_API_URL: "${BACKEND_API_URL:-http://backend:8000/api}"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped

  search-api:
    image: servio-search-api:dev
    container_name: servio-search-api
    profiles: ["platform-services", "platform-shadow", "platform-canary"]
    build: ./services/search-api
    environment:
      SERVICE_NAME: search-api
      SERVICE_PORT: "8010"
      SERVICE_VERSION: "0.2.0"
      BACKEND_BASE_URL: "${BACKEND_INTERNAL_URL:-http://backend:8000}"
      BACKEND_HEALTH_URL: "${BACKEND_HEALTH_URL:-http://backend:8000/health/}"
      BACKEND_INTERNAL_TOKEN: "${INTERNAL_TOKEN:-internal-token}"
      BACKEND_TIMEOUT_SECONDS: "${SEARCH_SERVICE_TIMEOUT_SECONDS:-0.8}"
      PLATFORM_SERVICE_LOG_LEVEL: "${PLATFORM_SERVICE_LOG_LEVEL:-INFO}"
      ENABLE_BACKEND_READY_CHECK: "${ENABLE_PLATFORM_BACKEND_READY_CHECK:-1}"
      PLATFORM_UPSTREAM_MODE: "${SEARCH_SERVICE_MODE:-django-inline}"
      PLATFORM_SHADOW_ENABLED: "${SEARCH_SERVICE_SHADOW_ENABLED:-0}"
      PLATFORM_SHADOW_SURFACES: "${SEARCH_SERVICE_SHADOW_SURFACES:-search-page,live-search}"
      PLATFORM_CANARY_ENABLED: "${SEARCH_SERVICE_CANARY_ENABLED:-0}"
      PLATFORM_CANARY_SURFACES: "${SEARCH_SERVICE_CANARY_SURFACES:-search-page}"
      PLATFORM_CANARY_PERCENT: "${SEARCH_SERVICE_CANARY_PERCENT:-0}"
      PLATFORM_ROLLOUT_LABEL: "${SEARCH_SERVICE_ROLLOUT_LABEL:-search-service}"
      PLATFORM_OBSERVABILITY_LABEL: "${SEARCH_SERVICE_OBSERVABILITY_LABEL:-search-service}"
    expose:
      - "8010"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=2).status == 200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  recommendation-api:
    image: servio-recommendation-api:dev
    container_name: servio-recommendation-api
    profiles: ["platform-services", "platform-shadow", "platform-canary"]
    build: ./services/recommendation-api
    environment:
      SERVICE_NAME: recommendation-api
      SERVICE_PORT: "8011"
      SERVICE_VERSION: "0.2.0"
      BACKEND_API_URL: "${BACKEND_API_URL_INTERNAL:-http://backend:8000/api}"
      BACKEND_BASE_URL: "${BACKEND_INTERNAL_URL:-http://backend:8000}"
      BACKEND_HEALTH_URL: "${BACKEND_HEALTH_URL:-http://backend:8000/health/}"
      BACKEND_INTERNAL_TOKEN: "${INTERNAL_TOKEN:-internal-token}"
      BACKEND_TIMEOUT_SECONDS: "${RECOMMENDATION_SERVICE_TIMEOUT_SECONDS:-0.8}"
      PLATFORM_SERVICE_LOG_LEVEL: "${PLATFORM_SERVICE_LOG_LEVEL:-INFO}"
      ENABLE_BACKEND_READY_CHECK: "${ENABLE_PLATFORM_BACKEND_READY_CHECK:-1}"
      PLATFORM_UPSTREAM_MODE: "${RECOMMENDATION_SERVICE_MODE:-django-inline}"
      PLATFORM_SHADOW_ENABLED: "${RECOMMENDATION_SERVICE_SHADOW_ENABLED:-0}"
      PLATFORM_SHADOW_SURFACES: "${RECOMMENDATION_SERVICE_SHADOW_SURFACES:-home,pdp,cart,checkout,reorder}"
      PLATFORM_CANARY_ENABLED: "${RECOMMENDATION_SERVICE_CANARY_ENABLED:-0}"
      PLATFORM_CANARY_SURFACES: "${RECOMMENDATION_SERVICE_CANARY_SURFACES:-home,pdp}"
      PLATFORM_CANARY_PERCENT: "${RECOMMENDATION_SERVICE_CANARY_PERCENT:-0}"
      PLATFORM_ROLLOUT_LABEL: "${RECOMMENDATION_SERVICE_ROLLOUT_LABEL:-recommendation-service}"
      PLATFORM_OBSERVABILITY_LABEL: "${RECOMMENDATION_SERVICE_OBSERVABILITY_LABEL:-recommendation-service}"
    expose:
      - "8011"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8011/ready', timeout=2).status == 200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  backend:
    image: servio-backend:dev
    container_name: servio-backend
    build: ./backend
    env_file:
      - path: ./backend/.env.example
        required: true
      - path: ./backend/.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CACHE_BACKEND: redis
      ENABLE_REQUEST_ACCESS_LOG: "0"
      LOG_CALLS_ENABLED: "0"
      REQUEST_LOG_LEVEL: WARNING
      ENABLE_CATALOG_RATING: "0"
      SEARCH_SERVICE_MODE: "${SEARCH_SERVICE_MODE:-django-inline}"
      SEARCH_SERVICE_URL: "${SEARCH_SERVICE_URL:-http://search-api:8010}"
      SEARCH_SERVICE_TIMEOUT_SECONDS: "${SEARCH_SERVICE_TIMEOUT_SECONDS:-0.8}"
      SEARCH_SERVICE_SHADOW_ENABLED: "${SEARCH_SERVICE_SHADOW_ENABLED:-0}"
      SEARCH_SERVICE_SHADOW_SURFACES: "${SEARCH_SERVICE_SHADOW_SURFACES:-search-page,live-search}"
      SEARCH_SERVICE_CANARY_ENABLED: "${SEARCH_SERVICE_CANARY_ENABLED:-0}"
      SEARCH_SERVICE_CANARY_SURFACES: "${SEARCH_SERVICE_CANARY_SURFACES:-search-page}"
      SEARCH_SERVICE_CANARY_PERCENT: "${SEARCH_SERVICE_CANARY_PERCENT:-0}"
      SEARCH_SERVICE_ROLLOUT_LABEL: "${SEARCH_SERVICE_ROLLOUT_LABEL:-search-service}"
      SEARCH_SERVICE_OBSERVABILITY_LABEL: "${SEARCH_SERVICE_OBSERVABILITY_LABEL:-search-service}"
      RECOMMENDATION_SERVICE_MODE: "${RECOMMENDATION_SERVICE_MODE:-django-inline}"
      RECOMMENDATION_SERVICE_URL: "${RECOMMENDATION_SERVICE_URL:-http://recommendation-api:8011}"
      RECOMMENDATION_SERVICE_TIMEOUT_SECONDS: "${RECOMMENDATION_SERVICE_TIMEOUT_SECONDS:-0.8}"
      RECOMMENDATION_SERVICE_SHADOW_ENABLED: "${RECOMMENDATION_SERVICE_SHADOW_ENABLED:-0}"
      RECOMMENDATION_SERVICE_SHADOW_SURFACES: "${RECOMMENDATION_SERVICE_SHADOW_SURFACES:-home,pdp,cart,checkout,reorder}"
      RECOMMENDATION_SERVICE_CANARY_ENABLED: "${RECOMMENDATION_SERVICE_CANARY_ENABLED:-0}"
      RECOMMENDATION_SERVICE_CANARY_SURFACES: "${RECOMMENDATION_SERVICE_CANARY_SURFACES:-home,pdp}"
      RECOMMENDATION_SERVICE_CANARY_PERCENT: "${RECOMMENDATION_SERVICE_CANARY_PERCENT:-0}"
      RECOMMENDATION_SERVICE_ROLLOUT_LABEL: "${RECOMMENDATION_SERVICE_ROLLOUT_LABEL:-recommendation-service}"
      RECOMMENDATION_SERVICE_OBSERVABILITY_LABEL: "${RECOMMENDATION_SERVICE_OBSERVABILITY_LABEL:-recommendation-service}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-6}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-180}"
      GUNICORN_KEEPALIVE: "${GUNICORN_KEEPALIVE:-15}"
      GUNICORN_MAX_REQUESTS: "${GUNICORN_MAX_REQUESTS:-1200}"
      GUNICORN_MAX_REQUESTS_JITTER: "${GUNICORN_MAX_REQUESTS_JITTER:-120}"
    depends_on:
      - db
      - redis
      - bot
      - opensearch
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./backend/media:/app/media
      - staticfiles:/app/staticfiles
      - ./logs:/app/logs
    expose:
      - "8000"
    command: ["sh", "-lc", "until /app/.venv/bin/python manage.py migrate --noinput; do echo 'Waiting for DB...'; sleep 2; done; exec /app/.venv/bin/gunicorn config.asgi:application -c config/gunicorn.py"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: potatofarm.ru' http://127.0.0.1:8000/health/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  celery-worker:
    image: servio-backend:dev
    container_name: servio-worker
    env_file:
      - path: ./backend/.env.example
        required: true
      - path: ./backend/.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "celery", "-A", "config.celery", "worker", "-l", "INFO"]
    depends_on: [backend, redis, db]
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./logs:/app/logs
    logging: *default-logging
    restart: unless-stopped

  celery-beat:
    image: servio-backend:dev
    container_name: servio-beat
    env_file:
      - path: ./backend/.env.example
        required: true
      - path: ./backend/.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "celery", "-A", "config.celery", "beat", "-l", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on: [backend, redis, db]
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./logs:/app/logs
    logging: *default-logging
    restart: unless-stopped

  backend-test:
    image: servio-backend:test
    profiles: ["test"]
    build:
      context: ./backend
      args:
        INSTALL_DEV: "1"
    env_file:
      - path: ./backend/.env.example
        required: true
      - path: ./backend/.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CACHE_BACKEND: redis
      ENABLE_REQUEST_ACCESS_LOG: "0"
      LOG_CALLS_ENABLED: "0"
      REQUEST_LOG_LEVEL: WARNING
      ENABLE_CATALOG_RATING: "0"
      SENTRY_DSN: ""
      PUBLIC_SENTRY_DSN: ""
      SENTRY_BROWSER_SDK_URL: ""
    depends_on:
      - db
      - redis
      - opensearch
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./backend/media:/app/media
      - ./logs:/app/logs
    logging: *default-logging

  bot:
    image: servio-bot:dev
    build: ./bot
    container_name: servio-bot
    env_file:
      - path: ./bot/.env.example
        required: true
      - path: ./bot/.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "uvicorn", "app.main_shop:app", "--host", "0.0.0.0", "--port", "8080"]
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  bot-twa:
    image: servio-bot:dev
    container_name: servio-bot-twa
    profiles: ["bots-extra"]
    env_file:
      - path: ./bot/.env.example
        required: true
      - path: ./bot/.env.twa
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "uvicorn", "app.main_shop:app", "--host", "0.0.0.0", "--port", "8080"]
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  bot-notify:
    image: servio-bot:dev
    container_name: servio-bot-notify
    env_file:
      - path: ./bot/.env.notify.example
        required: true
      - path: ./bot/.env.notify
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "uvicorn", "app.main_notify:app", "--host", "0.0.0.0", "--port", "8080"]
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  db:
    image: public.ecr.aws/docker/library/postgres:16
    container_name: servio-db
    command: ["postgres", "-c", "max_connections=1000", "-c", "shared_buffers=512MB"]
    env_file:
      - path: ./backend/.env.example
        required: true
      - path: ./backend/.env
        required: false
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: public.ecr.aws/docker/library/redis:7
    container_name: servio-redis
    volumes:
      - redisdata:/data
    logging: *default-logging
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: servio-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    logging: *default-logging
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: servio-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-ServioOpenSearchLocal123!}"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile.dev
    image: servio-nginx:dev
    container_name: servio-nginx
    environment:
      BACKEND_UPSTREAM: http://backend:8000
      FRONTEND_UPSTREAM: http://frontend:3000
      STOREFRONT_NEXT_PUBLIC_ENABLED: "${STOREFRONT_NEXT_PUBLIC_ENABLED:-0}"
    # В dev не блокируем старт Nginx ожиданием health бэкенда,
    # чтобы /health/ открывался даже при проблемах миграций
    depends_on: [backend, frontend]
    ports: ["${NGINX_HTTP_PORT:-8080}:80"]
    volumes:
      - staticfiles:/staticfiles:ro
      - ./backend/media:/media:ro
      - ./deploy/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Host: potatofarm.ru' http://127.0.0.1/health/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

volumes:
  pgdata:
    external: true
    name: servio_pgdata
  opensearchdata:
    external: true
    name: servio_opensearchdata
  redisdata:
    external: true
    name: servio_redisdata
  staticfiles:
    external: true
    name: servio_staticfiles
